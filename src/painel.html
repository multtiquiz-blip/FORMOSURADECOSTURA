<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle | Rose Gerçóssimo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fbf9f8; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .soft-shadow { box-shadow: 0 4px 20px rgba(184, 0, 73, 0.05); }
        .stitching-border { border: 2px dashed #e4bdc2; }
    </style>
</head>
<body>
    <div class="max-w-[1280px] mx-auto px-4 md:px-6 py-8">
        <header class="mb-10 flex justify-between items-center border-b border-dashed border-[#e4bdc2] pb-5">
            <div>
                <h1 class="text-4xl font-bold text-[#b80049] font-serif">Painel de Controle</h1>
                <p class="text-[#5d5f5f]">Gerencie todas as informações do Media Kit</p>
            </div>
            <a href="index.html" target="_blank" class="px-5 py-2 border border-[#b80049] text-[#b80049] rounded-lg hover:bg-[#b80049]/10 flex items-center gap-2">
                <span class="material-symbols-outlined">visibility</span> Ver site
            </a>
        </header>

        <div id="formulario-painel" class="space-y-8">
            <div class="text-center py-10 text-[#5d5f5f]">Carregando dados...</div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-dashed border-[#e4bdc2] p-5 z-50">
            <div class="max-w-[1280px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-2 text-[#5d5f5f] text-sm" id="status-msg">
                    <span class="material-symbols-outlined text-[#b80049] text-base">info</span> Pronto para salvar
                </div>
                <div class="flex gap-4">
                    <button onclick="descartarAlteracoes()" class="px-8 py-2 border border-dashed border-[#5d5f5f] text-[#5d5f5f] rounded-lg hover:bg-[#efeded]">Descartar</button>
                    <button onclick="salvarTudo()" class="px-10 py-2 bg-[#b80049] text-white rounded-lg shadow-md hover:opacity-90 flex items-center gap-2">
                        <span class="material-symbols-outlined">publish</span> Salvar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nhnhqjyrawaftlomlilg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5obmhxanlyYXdhZnRsb21saWxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDY3ODgsImV4cCI6MjA5Njc4Mjc4OH0.GtOdh4sLzxrwPxOvnKJO5bf4x4hebpuC9RlR-06V0RE';

        let dadosOriginais = null;

        async function carregarDados() {
            const container = document.getElementById('formulario-painel');
            try {
                const configResp = await fetch(`${SUPABASE_URL}/rest/v1/site_config?select=config_key,config_value`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                if (!configResp.ok) throw new Error(`HTTP ${configResp.status}`);
                const configArray = await configResp.json();
                const config = {};
                configArray.forEach(item => { config[item.config_key] = item.config_value; });

                const portResp = await fetch(`${SUPABASE_URL}/rest/v1/portfolio?select=*&order=ordem`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const portfolio = await portResp.json();

                dadosOriginais = { config, portfolio };
                renderizarFormulario(config, portfolio);
            } catch (err) {
                container.innerHTML = `<div class="bg-red-100 text-red-700 p-6 rounded-xl">Erro: ${err.message}</div>`;
            }
        }

        function renderizarFormulario(config, portfolio) {
            const html = `
                <section class="bg-white p-6 rounded-xl soft-shadow border">
                    <h2 class="text-2xl text-[#b80049] mb-5 flex items-center gap-2"><span class="material-symbols-outlined">photo_camera</span> Foto de Perfil</h2>
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">URL da imagem (quadrada recomendada)</label><input type="text" id="foto_perfil_url" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.foto_perfil_url)}"></div>
                </section>

                <section class="bg-white p-6 rounded-xl soft-shadow border">
                    <h2 class="text-2xl text-[#b80049] mb-5 flex items-center gap-2"><span class="material-symbols-outlined">edit_note</span> Dados principais</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div><label class="block text-xs font-bold uppercase">Nome profissional</label><input type="text" id="nome_profissional" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.nome_profissional)}"></div>
                        <div><label class="block text-xs font-bold uppercase">Subnome</label><input type="text" id="sub_nome" class="w-full border-0 border-b" value="${escapeHtml(config.sub_nome)}"></div>
                        <div class="md:col-span-2"><label class="block text-xs font-bold uppercase">Bio curta</label><input type="text" id="bio_curta" class="w-full border-0 border-b" value="${escapeHtml(config.bio_curta)}"></div>
                        <div><label class="block text-xs font-bold uppercase">E-mail</label><input type="email" id="email_contato" class="w-full border-0 border-b" value="${escapeHtml(config.email_contato)}"></div>
                        <div><label class="block text-xs font-bold uppercase">Telefone</label><input type="text" id="telefone_contato" class="w-full border-0 border-b" value="${escapeHtml(config.telefone_contato)}"></div>
                    </div>
                </section>

                <section class="bg-white p-6 rounded-xl soft-shadow border">
                    <h2 class="text-2xl text-[#b80049] mb-5 flex items-center gap-2"><span class="material-symbols-outlined">link</span> Redes sociais e YouTube</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div><label class="block text-xs font-bold uppercase">URL do YouTube (canal)</label><input type="text" id="youtube_url" class="w-full border-0 border-b" value="${escapeHtml(config.youtube_url)}"></div>
                        <div><label class="block text-xs font-bold uppercase">URL do Instagram</label><input type="text" id="instagram_url" class="w-full border-0 border-b" value="${escapeHtml(config.instagram_url)}"></div>
                        <div><label class="block text-xs font-bold uppercase">URL do TikTok</label><input type="text" id="tiktok_url" class="w-full border-0 border-b" value="${escapeHtml(config.tiktok_url)}"></div>
                        <div><label class="block text-xs font-bold uppercase">ID do vídeo YouTube (ex: dQw4w9WgXcQ)</label><input type="text" id="youtube_video_id" class="w-full border-0 border-b" value="${escapeHtml(config.youtube_video_id)}"></div>
                    </div>
                </section>

                <section class="bg-white p-6 rounded-xl soft-shadow border">
                    <h2 class="text-2xl text-[#b80049] mb-5 flex items-center gap-2"><span class="material-symbols-outlined">local_offer</span> Tags e textos da hero</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div><label class="block text-xs font-bold uppercase">Tag 1</label><input type="text" id="tag1" class="w-full border-0 border-b" value="${escapeHtml(config.tag1)}"></div>
                        <div><label class="block text-xs font-bold uppercase">Tag 2</label><input type="text" id="tag2" class="w-full border-0 border-b" value="${escapeHtml(config.tag2)}"></div>
                    </div>
                </section>

                <section class="bg-white p-6 rounded-xl soft-shadow border">
                    <h2 class="text-2xl text-[#b80049] mb-5 flex items-center gap-2"><span class="material-symbols-outlined">analytics</span> Métricas sociais</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-xs font-bold uppercase">TikTok views</label><input type="text" id="tiktok_views" value="${escapeHtml(config.tiktok_views)}" class="w-full border-0 border-b">
                            <label class="block text-xs mt-2">Descrição</label><input type="text" id="tiktok_desc" value="${escapeHtml(config.tiktok_desc)}" class="w-full border-0 border-b">
                            <label class="block text-xs mt-2">%</label><input type="number" id="tiktok_percent" value="${config.tiktok_percent}" class="w-full border-0 border-b">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase">Reels reach</label><input type="text" id="reels_reach" value="${escapeHtml(config.reels_reach)}" class="w-full border-0 border-b">
                            <label class="block text-xs mt-2">Descrição</label><input type="text" id="reels_desc" value="${escapeHtml(config.reels_desc)}" class="w-full border-0 border-b">
                            <label class="block text-xs mt-2">%</label><input type="number" id="reels_percent" value="${config.reels_percent}" class="w-full border-0 border-b">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase">Comunidade</label><input type="text" id="comunidade_num" value="${escapeHtml(config.comunidade_num)}" class="w-full border-0 border-b">
                            <label class="block text-xs mt-2">Descrição</label><input type="text" id="comunidade_desc" value="${escapeHtml(config.comunidade_desc)}" class="w-full border-0 border-b">
                        </div>
                    </div>
                    <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div><label class="block text-xs font-bold uppercase">Live views</label><input type="text" id="live_views" value="${escapeHtml(config.live_views)}" class="w-full border-0 border-b"><label class="block text-xs mt-2">Descrição</label><input type="text" id="live_desc" value="${escapeHtml(config.live_desc)}" class="w-full border-0 border-b"></div>
                        <div><label class="block text-xs font-bold uppercase">Texto destaque live (card vermelho)</label><textarea id="live_texto_destaque" rows="2" class="w-full border-0 border-b">${escapeHtml(config.live_texto_destaque)}</textarea></div>
                    </div>
                </section>

                <section class="bg-white p-6 rounded-xl soft-shadow border">
                    <h2 class="text-2xl text-[#b80049] mb-5 flex items-center gap-2"><span class="material-symbols-outlined">pie_chart</span> Perfil da audiência</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div><label class="block text-xs font-bold uppercase">% gênero</label><input type="text" id="genero_porcentagem" value="${escapeHtml(config.genero_porcentagem)}" class="w-full border-0 border-b"><label class="block text-xs mt-2">Texto</label><input type="text" id="genero_texto" value="${escapeHtml(config.genero_texto)}" class="w-full border-0 border-b"></div>
                        <div><label class="block text-xs font-bold uppercase">Faixa etária</label><input type="text" id="idade_range" value="${escapeHtml(config.idade_range)}" class="w-full border-0 border-b"><label class="block text-xs mt-2">Texto</label><input type="text" id="idade_texto" value="${escapeHtml(config.idade_texto)}" class="w-full border-0 border-b"></div>
                        <div class="md:col-span-2"><label class="block text-xs font-bold uppercase">Citação</label><textarea id="citacao" rows="2" class="w-full border-0 border-b">${escapeHtml(config.citacao)}</textarea></div>
                    </div>
                </section>

                <section class="bg-white p-6 rounded-xl soft-shadow border">
                    <h2 class="text-2xl text-[#b80049] mb-5 flex items-center gap-2"><span class="material-symbols-outlined">shopping_cart_checkout</span> Proposta comercial</h2>
                    <div><label class="block text-xs font-bold uppercase">Título</label><input type="text" id="texto_proposta" value="${escapeHtml(config.texto_proposta)}" class="w-full border-0 border-b"></div>
                    <div class="mt-4"><label class="block text-xs font-bold uppercase">Subtítulo</label><textarea id="subtitulo_proposta" rows="2" class="w-full border-0 border-b">${escapeHtml(config.subtitulo_proposta)}</textarea></div>
                </section>

                <section class="bg-white p-6 rounded-xl soft-shadow border">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-2xl text-[#b80049] flex items-center gap-2"><span class="material-symbols-outlined">collections_bookmark</span> Portfólio</h2>
                        <button onclick="adicionarProjeto()" class="bg-[#b80049]/10 text-[#b80049] px-4 py-2 rounded-lg text-sm font-bold">+ Adicionar projeto</button>
                    </div>
                    <div id="portfolio-editor" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </section>
            `;
            document.getElementById('formulario-painel').innerHTML = html;
            renderizarPortfolioEditor(portfolio);
        }

        function renderizarPortfolioEditor(portfolio) {
            const container = document.getElementById('portfolio-editor');
            if (!container) return;
            container.innerHTML = '';
            portfolio.forEach(item => {
                const card = document.createElement('div');
                card.className = 'border border-dashed border-[#e4bdc2] rounded-lg p-3 bg-[#fef8f6]';
                card.innerHTML = `
                    <div class="aspect-square rounded-md overflow-hidden mb-2"><img src="${escapeHtml(item.imagem_url)}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x400?text=Erro'"></div>
                    <label class="block text-xs font-bold uppercase">URL da imagem</label>
                    <input type="text" data-id="${item.id}" data-campo="imagem_url" class="portfolio-input w-full border-0 border-b" value="${escapeHtml(item.imagem_url)}">
                    <label class="block text-xs font-bold uppercase mt-2">Legenda</label>
                    <input type="text" data-id="${item.id}" data-campo="legenda" class="portfolio-input w-full border-0 border-b" value="${escapeHtml(item.legenda)}">
                    <div class="flex justify-between mt-3"><span class="text-xs">Ordem: ${item.ordem}</span><button onclick="removerProjeto(${item.id})" class="text-red-500 text-xs">Remover</button></div>
                `;
                container.appendChild(card);
            });
        }

        window.adicionarProjeto = function() {
            const novoId = Date.now();
            const container = document.getElementById('portfolio-editor');
            const card = document.createElement('div');
            card.className = 'border border-dashed border-[#e4bdc2] rounded-lg p-3 bg-[#fef8f6]';
            card.innerHTML = `
                <div class="aspect-square rounded-md overflow-hidden mb-2 bg-gray-200 flex items-center justify-center text-gray-400">Nova imagem</div>
                <label class="block text-xs font-bold uppercase">URL da imagem</label>
                <input type="text" data-id="${novoId}" data-campo="imagem_url" class="portfolio-input w-full border-0 border-b" value="https://placehold.co/600x600">
                <label class="block text-xs font-bold uppercase mt-2">Legenda</label>
                <input type="text" data-id="${novoId}" data-campo="legenda" class="portfolio-input w-full border-0 border-b" value="Novo projeto">
                <div class="flex justify-between mt-3"><span class="text-xs">Novo</span><button onclick="removerProjeto(${novoId})" class="text-red-500 text-xs">Remover</button></div>
            `;
            container.appendChild(card);
        };

        window.removerProjeto = function(id) {
            const cards = document.querySelectorAll('#portfolio-editor .border');
            for (let card of cards) {
                if (card.innerHTML.includes(`data-id="${id}"`)) {
                    card.remove();
                    break;
                }
            }
        };

        async function salvarTudo() {
            const statusDiv = document.getElementById('status-msg');
            statusDiv.innerHTML = '<span class="material-symbols-outlined text-[#b80049] text-base animate-spin">refresh</span> Salvando...';

            const updates = {};
            const ids = [
                'foto_perfil_url', 'nome_profissional', 'sub_nome', 'bio_curta', 'email_contato', 'telefone_contato',
                'youtube_url', 'instagram_url', 'tiktok_url', 'youtube_video_id', 'tag1', 'tag2',
                'tiktok_views', 'tiktok_desc', 'tiktok_percent', 'reels_reach', 'reels_desc', 'reels_percent',
                'comunidade_num', 'comunidade_desc', 'live_views', 'live_desc', 'live_texto_destaque',
                'genero_porcentagem', 'genero_texto', 'idade_range', 'idade_texto', 'citacao',
                'texto_proposta', 'subtitulo_proposta'
            ];
            for (let id of ids) {
                const el = document.getElementById(id);
                if (el) updates[id] = el.value;
            }

            for (let [chave, valor] of Object.entries(updates)) {
                await fetch(`${SUPABASE_URL}/rest/v1/site_config?config_key=eq.${chave}`, {
                    method: 'PATCH',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ config_value: valor })
                });
            }

            const portfolioItens = [];
            let ordem = 0;
            document.querySelectorAll('#portfolio-editor .border').forEach(card => {
                const imgInput = card.querySelector('input[data-campo="imagem_url"]');
                const legInput = card.querySelector('input[data-campo="legenda"]');
                if (imgInput && legInput) {
                    portfolioItens.push({
                        id: parseInt(imgInput.getAttribute('data-id')) || null,
                        imagem_url: imgInput.value,
                        legenda: legInput.value,
                        ordem: ordem++
                    });
                }
            });

            await fetch(`${SUPABASE_URL}/rest/v1/portfolio?order=ordem`, { method: 'DELETE', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
            for (let item of portfolioItens) {
                await fetch(`${SUPABASE_URL}/rest/v1/portfolio`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imagem_url: item.imagem_url, legenda: item.legenda, ordem: item.ordem })
                });
            }

            statusDiv.innerHTML = '<span class="material-symbols-outlined text-green-600 text-base">check_circle</span> Salvo!';
            setTimeout(() => statusDiv.innerHTML = '<span class="material-symbols-outlined text-[#b80049] text-base">info</span> Pronto', 3000);
            await carregarDados();
        }

        window.descartarAlteracoes = () => { if(confirm('Descartar?')) carregarDados(); };
        function escapeHtml(str) { return (str || '').replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

        carregarDados();
    </script>
</body>
</html>
