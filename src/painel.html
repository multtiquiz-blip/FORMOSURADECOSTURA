<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle | Rose Gerçóssimo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fbf9f8; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .soft-shadow { box-shadow: 0 4px 20px rgba(184, 0, 73, 0.05); }
        .stitching-border { border: 2px dashed #e4bdc2; }
    </style>
</head>
<body>

<div id="login-container" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#fbf9f8] to-[#fef5f2]">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
        <div class="w-20 h-20 mx-auto bg-[#b80049]/10 rounded-full flex items-center justify-center mb-4">
            <span class="material-symbols-outlined text-[#b80049] text-4xl">lock</span>
        </div>
        <h2 class="text-2xl font-bold text-[#b80049] mb-2">Área Restrita</h2>
        <p class="text-[#5d5f5f] mb-6">Digite a senha para acessar o painel</p>
        <input type="password" id="senha-input" class="w-full border border-[#e4bdc2] rounded-lg px-4 py-2 focus:outline-none focus:border-[#b80049] mb-4" placeholder="Senha">
        <button onclick="verificarSenha()" class="w-full bg-[#b80049] text-white py-2 rounded-lg font-bold hover:bg-[#9c003e] transition">Entrar</button>
        <p id="erro-senha" class="text-red-500 text-sm mt-3 hidden">Senha incorreta. Tente novamente.</p>
    </div>
</div>

<div id="painel-container" style="display: none;">
    <div class="max-w-[1280px] mx-auto px-4 md:px-6 py-8">
        <header class="mb-10 flex justify-between items-center border-b border-dashed border-[#e4bdc2] pb-5">
            <div>
                <h1 class="text-4xl font-bold text-[#b80049] font-serif">Painel de Controle</h1>
                <p class="text-[#5d5f5f]">Gerencie todas as informações do seu Media Kit</p>
            </div>
            <div class="flex gap-3">
                <a href="index.html" target="_blank" class="px-5 py-2 border border-[#b80049] text-[#b80049] rounded-lg hover:bg-[#b80049]/10 flex items-center gap-2">
                    <span class="material-symbols-outlined">visibility</span> Ver site
                </a>
                <button onclick="logout()" class="px-5 py-2 border border-red-500 text-red-500 rounded-lg hover:bg-red-50 flex items-center gap-2">
                    <span class="material-symbols-outlined">logout</span> Sair
                </button>
            </div>
        </header>

        <div id="formulario-painel" class="space-y-8">
            <div class="text-center py-10 text-[#5d5f5f]">Carregando dados do banco...</div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-dashed border-[#e4bdc2] p-5 z-50">
            <div class="max-w-[1280px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-2 text-[#5d5f5f] text-sm" id="status-msg">
                    <span class="material-symbols-outlined text-[#b80049] text-base">info</span> Pronto para salvar
                </div>
                <div class="flex gap-4">
                    <button onclick="descartarAlteracoes()" class="px-8 py-2 border border-dashed border-[#5d5f5f] text-[#5d5f5f] rounded-lg hover:bg-[#efeded]">Descartar</button>
                    <button onclick="salvarTudo()" class="px-10 py-2 bg-[#b80049] text-white rounded-lg shadow-md hover:opacity-90 flex items-center gap-2">
                        <span class="material-symbols-outlined">publish</span> Salvar e publicar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== CONFIGURAÇÕES ==========
    const SUPABASE_URL = 'https://nhnhqjyrawaftlomlilg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5obmhxanlyYXdhZnRsb21saWxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDY3ODgsImV4cCI6MjA5Njc4Mjc4OH0.GtOdh4sLzxrwPxOvnKJO5bf4x4hebpuC9RlR-06V0RE';
    const SENHA_CORRETA = 'Rose2025';  // ALTERE A SENHA AQUI
    // ===================================

    let dadosOriginais = null;

    function verificarSenha() {
        const senha = document.getElementById('senha-input').value;
        if (senha === SENHA_CORRETA) {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('painel-container').style.display = 'block';
            carregarDados();
        } else {
            const erroEl = document.getElementById('erro-senha');
            erroEl.classList.remove('hidden');
            setTimeout(() => erroEl.classList.add('hidden'), 3000);
        }
    }

    function logout() {
        document.getElementById('login-container').style.display = 'flex';
        document.getElementById('painel-container').style.display = 'none';
        document.getElementById('senha-input').value = '';
    }

    async function carregarDados() {
        const container = document.getElementById('formulario-painel');
        try {
            const configResp = await fetch(`${SUPABASE_URL}/rest/v1/site_config?select=config_key,config_value`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
            });
            const configArray = await configResp.json();
            const config = {};
            configArray.forEach(item => { config[item.config_key] = item.config_value; });

            const portResp = await fetch(`${SUPABASE_URL}/rest/v1/portfolio?select=*&order=ordem`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
            });
            const portfolio = await portResp.json();

            dadosOriginais = { config, portfolio };
            renderizarFormulario(config, portfolio);
        } catch (err) {
            container.innerHTML = `<div class="bg-red-100 p-6 rounded-xl text-red-700">Erro: ${err.message}</div>`;
        }
    }

    function renderizarFormulario(config, portfolio) {
        const html = `
            <!-- Dados principais -->
            <section class="bg-white p-6 rounded-xl soft-shadow border border-[#e4bdc2]/30">
                <h2 class="text-2xl text-[#b80049] mb-5 flex items-center gap-2"><span class="material-symbols-outlined">edit_note</span> Dados principais</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">Nome profissional</label><input type="text" id="nome_profissional" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.nome_profissional)}"></div>
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">Subnome (título)</label><input type="text" id="sub_nome" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.sub_nome)}"></div>
                    <div class="md:col-span-2"><label class="block text-xs font-bold uppercase text-[#5d5f5f]">Bio curta</label><input type="text" id="bio_curta" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.bio_curta)}"></div>
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">E-mail de contato</label><input type="email" id="email_contato" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.email_contato)}"></div>
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">Telefone</label><input type="text" id="telefone_contato" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.telefone_contato)}"></div>
                    <div class="md:col-span-2"><label class="block text-xs font-bold uppercase text-[#5d5f5f]">URL da foto de perfil</label><input type="text" id="foto_perfil_url" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.foto_perfil_url)}"></div>
                </div>
            </section>

            <!-- Redes sociais e vídeo -->
            <section class="bg-white p-6 rounded-xl soft-shadow border border-[#e4bdc2]/30">
                <h2 class="text-2xl text-[#b80049] mb-5 flex items-center gap-2"><span class="material-symbols-outlined">share</span> Redes sociais e vídeo</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">YouTube (URL do canal)</label><input type="text" id="youtube_url" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.youtube_url)}"></div>
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">Instagram (URL)</label><input type="text" id="instagram_url" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.instagram_url)}"></div>
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">TikTok (URL)</label><input type="text" id="tiktok_url" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.tiktok_url)}"></div>
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">ID do vídeo do YouTube (ex: dQw4w9WgXcQ)</label><input type="text" id="youtube_video_id" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.youtube_video_id)}"></div>
                </div>
            </section>

            <!-- Tags personalizáveis -->
            <section class="bg-white p-6 rounded-xl soft-shadow border border-[#e4bdc2]/30">
                <h2 class="text-2xl text-[#b80049] mb-5 flex items-center gap-2"><span class="material-symbols-outlined">local_offer</span> Tags / Selos</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">Tag 1 (esquerda)</label><input type="text" id="tag1" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.tag1)}"></div>
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">Tag 2 (direita)</label><input type="text" id="tag2" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.tag2)}"></div>
                </div>
            </section>

            <!-- Métricas sociais -->
            <section class="bg-white p-6 rounded-xl soft-shadow border border-[#e4bdc2]/30">
                <h2 class="text-2xl text-[#b80049] mb-5 flex items-center gap-2"><span class="material-symbols-outlined">analytics</span> Métricas sociais</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase text-[#5d5f5f]">TikTok views</label><input type="text" id="tiktok_views" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.tiktok_views)}">
                        <label class="block text-xs mt-2">Descrição</label><input type="text" id="tiktok_desc" value="${escapeHtml(config.tiktok_desc)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2">
                        <label class="block text-xs mt-2">Porcentagem da barra (0-100)</label><input type="number" id="tiktok_percent" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${config.tiktok_percent}">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-[#5d5f5f]">Reels reach</label><input type="text" id="reels_reach" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.reels_reach)}">
                        <label class="block text-xs mt-2">Descrição</label><input type="text" id="reels_desc" value="${escapeHtml(config.reels_desc)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2">
                        <label class="block text-xs mt-2">Porcentagem</label><input type="number" id="reels_percent" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${config.reels_percent}">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-[#5d5f5f]">Comunidade (número)</label><input type="text" id="comunidade_num" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.comunidade_num)}">
                        <label class="block text-xs mt-2">Descrição</label><input type="text" id="comunidade_desc" value="${escapeHtml(config.comunidade_desc)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2">
                    </div>
                </div>
                <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">Live views (destaque)</label><input type="text" id="live_views" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.live_views)}"><label class="block text-xs mt-2">Descrição</label><input type="text" id="live_desc" value="${escapeHtml(config.live_desc)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2"></div>
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">Texto do card de destaque</label><textarea id="live_texto_destaque" rows="2" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2">${escapeHtml(config.live_texto_destaque)}</textarea></div>
                </div>
            </section>

            <!-- Perfil da audiência -->
            <section class="bg-white p-6 rounded-xl soft-shadow border border-[#e4bdc2]/30">
                <h2 class="text-2xl text-[#b80049] mb-5 flex items-center gap-2"><span class="material-symbols-outlined">pie_chart</span> Perfil da audiência</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">Porcentagem gênero</label><input type="text" id="genero_porcentagem" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.genero_porcentagem)}"><label class="block text-xs mt-2">Texto</label><input type="text" id="genero_texto" value="${escapeHtml(config.genero_texto)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2"></div>
                    <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">Faixa etária</label><input type="text" id="idade_range" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.idade_range)}"><label class="block text-xs mt-2">Texto descritivo</label><input type="text" id="idade_texto" value="${escapeHtml(config.idade_texto)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2"></div>
                    <div class="md:col-span-2"><label class="block text-xs font-bold uppercase text-[#5d5f5f]">Citação em destaque</label><textarea id="citacao" rows="2" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2">${escapeHtml(config.citacao)}</textarea></div>
                </div>
            </section>

            <!-- Proposta comercial -->
            <section class="bg-white p-6 rounded-xl soft-shadow border border-[#e4bdc2]/30">
                <h2 class="text-2xl text-[#b80049] mb-5 flex items-center gap-2"><span class="material-symbols-outlined">shopping_cart_checkout</span> Proposta comercial</h2>
                <div><label class="block text-xs font-bold uppercase text-[#5d5f5f]">Título principal</label><input type="text" id="texto_proposta" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.texto_proposta)}"></div>
                <div class="mt-4"><label class="block text-xs font-bold uppercase text-[#5d5f5f]">Subtítulo / descrição</label><textarea id="subtitulo_proposta" rows="2" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2">${escapeHtml(config.subtitulo_proposta)}</textarea></div>
            </section>

            <!-- Gerenciador de portfólio -->
            <section class="bg-white p-6 rounded-xl soft-shadow border border-[#e4bdc2]/30">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-2xl text-[#b80049] flex items-center gap-2"><span class="material-symbols-outlined">collections_bookmark</span> Portfólio</h2>
                    <button onclick="adicionarProjeto()" class="bg-[#b80049]/10 text-[#b80049] px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1"><span class="material-symbols-outlined text-base">add</span> Adicionar projeto</button>
                </div>
                <div id="portfolio-editor" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>
        `;

        document.getElementById('formulario-painel').innerHTML = html;
        renderizarPortfolioEditor(portfolio);
    }

    function renderizarPortfolioEditor(portfolio) {
        const container = document.getElementById('portfolio-editor');
        if (!container) return;
        container.innerHTML = '';
        portfolio.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'border border-dashed border-[#e4bdc2] rounded-lg p-3 bg-[#fef8f6]';
            card.innerHTML = `
                <div class="aspect-square rounded-md overflow-hidden mb-2">
                    <img src="${escapeHtml(item.imagem_url)}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x400?text=Imagem+inválida'">
                </div>
                <label class="block text-xs font-bold uppercase text-[#5d5f5f] mt-2">URL da imagem</label>
                <input type="text" data-id="${item.id}" data-campo="imagem_url" class="portfolio-input w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent text-sm" value="${escapeHtml(item.imagem_url)}">
                <label class="block text-xs font-bold uppercase text-[#5d5f5f] mt-2">Legenda</label>
                <input type="text" data-id="${item.id}" data-campo="legenda" class="portfolio-input w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent text-sm" value="${escapeHtml(item.legenda)}">
                <div class="flex justify-between mt-3">
                    <span class="text-xs text-[#5d5f5f]">Ordem: ${item.ordem}</span>
                    <button onclick="removerProjeto(this, ${item.id})" class="text-red-500 text-xs hover:underline">Remover</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Função corrigida para remover projeto tanto do DOM quanto do banco imediatamente
    window.removerProjeto = async function(botao, id) {
        if (!confirm('Tem certeza que deseja remover este projeto? A ação é irreversível.')) return;
        
        // Remove visualmente do DOM
        const card = botao.closest('.border');
        if (card) card.remove();
        
        // Remove do banco de dados
        try {
            await fetch(`${SUPABASE_URL}/rest/v1/portfolio?id=eq.${id}`, {
                method: 'DELETE',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
            });
            // Atualiza os dados originais (opcional)
            await carregarDados(); // Recarrega todo o painel para sincronizar
        } catch (err) {
            console.error('Erro ao remover projeto:', err);
            alert('Erro ao remover projeto. Recarregue a página e tente novamente.');
        }
    };

    window.adicionarProjeto = function() {
        const container = document.getElementById('portfolio-editor');
        const novoId = Date.now(); // ID temporário
        const card = document.createElement('div');
        card.className = 'border border-dashed border-[#e4bdc2] rounded-lg p-3 bg-[#fef8f6]';
        card.innerHTML = `
            <div class="aspect-square rounded-md overflow-hidden mb-2 bg-gray-200 flex items-center justify-center text-gray-400">Nova imagem</div>
            <label class="block text-xs font-bold uppercase text-[#5d5f5f] mt-2">URL da imagem</label>
            <input type="text" data-id="${novoId}" data-campo="imagem_url" class="portfolio-input w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent text-sm" value="https://placehold.co/600x600">
            <label class="block text-xs font-bold uppercase text-[#5d5f5f] mt-2">Legenda</label>
            <input type="text" data-id="${novoId}" data-campo="legenda" class="portfolio-input w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent text-sm" value="Novo projeto">
            <div class="flex justify-between mt-3">
                <span class="text-xs text-[#5d5f5f]">Novo</span>
                <button onclick="removerProjeto(this, ${novoId})" class="text-red-500 text-xs hover:underline">Remover</button>
            </div>
        `;
        container.appendChild(card);
    };

    async function salvarTudo() {
        const statusDiv = document.getElementById('status-msg');
        statusDiv.innerHTML = '<span class="material-symbols-outlined text-[#b80049] text-base animate-spin">refresh</span> Salvando...';

        // Coletar configurações
        const updates = {};
        const idsConfig = [
            'nome_profissional', 'sub_nome', 'bio_curta', 'email_contato', 'telefone_contato', 'foto_perfil_url',
            'youtube_url', 'instagram_url', 'tiktok_url', 'youtube_video_id',
            'tag1', 'tag2',
            'tiktok_views', 'tiktok_desc', 'tiktok_percent',
            'reels_reach', 'reels_desc', 'reels_percent',
            'comunidade_num', 'comunidade_desc',
            'live_views', 'live_desc', 'live_texto_destaque',
            'genero_porcentagem', 'genero_texto', 'idade_range', 'idade_texto',
            'citacao', 'texto_proposta', 'subtitulo_proposta'
        ];
        for (let id of idsConfig) {
            const el = document.getElementById(id);
            if (el) updates[id] = el.value;
        }

        // Salvar configurações (PATCH)
        for (let [chave, valor] of Object.entries(updates)) {
            await fetch(`${SUPABASE_URL}/rest/v1/site_config?config_key=eq.${chave}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ config_value: valor })
            });
        }

        // Coletar portfólio atual
        const portfolioItens = [];
        const cards = document.querySelectorAll('#portfolio-editor .border');
        let ordem = 0;
        for (let card of cards) {
            const inputsImagem = card.querySelector('input[data-campo="imagem_url"]');
            const inputsLegenda = card.querySelector('input[data-campo="legenda"]');
            if (inputsImagem && inputsLegenda) {
                let id = parseInt(inputsImagem.getAttribute('data-id'));
                if (isNaN(id) || id < 0) id = null;
                portfolioItens.push({
                    id: id,
                    imagem_url: inputsImagem.value,
                    legenda: inputsLegenda.value,
                    ordem: ordem++
                });
            }
        }

        // Substituir todo o portfólio (DELETE + INSERT)
        await fetch(`${SUPABASE_URL}/rest/v1/portfolio`, {
            method: 'DELETE',
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
        });
        for (let item of portfolioItens) {
            await fetch(`${SUPABASE_URL}/rest/v1/portfolio`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ imagem_url: item.imagem_url, legenda: item.legenda, ordem: item.ordem })
            });
        }

        statusDiv.innerHTML = '<span class="material-symbols-outlined text-green-600 text-base">check_circle</span> Salvo com sucesso!';
        setTimeout(() => {
            statusDiv.innerHTML = '<span class="material-symbols-outlined text-[#b80049] text-base">info</span> Pronto para salvar';
        }, 3000);
        await carregarDados(); // Recarrega para mostrar os dados atualizados
    }

    window.descartarAlteracoes = function() {
        if (confirm('Tem certeza? Todas as alterações não salvas serão perdidas.')) {
            carregarDados();
        }
    };

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
</script>
</body>
</html>
