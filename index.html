<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Kit | Rose Gerçóssimo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #fbf9f8 0%, #fef5f2 100%); color: #1b1c1c; scroll-behavior: smooth; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.6s ease-out forwards; }
        @keyframes growWidth { from { width: 0%; } to { width: var(--final-width); } }
        .animate-grow { animation: growWidth 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards; width: 0% !important; }
        .hover-lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -12px rgba(184, 0, 73, 0.15); }
        .stitching-border { border: 2px dashed #e4bdc2; }
        .soft-shadow { box-shadow: 0 8px 30px rgba(184, 0, 73, 0.08); }
        .youtube-lite { position: relative; cursor: pointer; transition: all 0.2s; aspect-ratio: 16/9; background: #000; border-radius: 1rem; overflow: hidden; }
        .youtube-lite img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .youtube-lite:hover img { transform: scale(1.02); }
        .youtube-lite .play-button { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; background: rgba(0,0,0,0.7); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .youtube-lite:hover .play-button { background: #b80049; transform: translate(-50%, -50%) scale(1.05); }
        .youtube-lite .play-button span { font-size: 40px; color: white; }
        @media (max-width: 768px) { .youtube-lite .play-button { width: 50px; height: 50px; } .youtube-lite .play-button span { font-size: 28px; } }
        @media print { .no-print { display: none !important; } body { background: white; } }
        
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 1rem;
        }
        
        /* 🎯 ANIMAÇÕES DAS MÉTRICAS */
        @keyframes shine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .metric-card {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -200%;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(184, 0, 73, 0.05), transparent);
            animation: shine 4s infinite;
            pointer-events: none;
        }
        .metric-number {
            display: inline-block;
            transition: all 0.3s ease;
            font-variant-numeric: tabular-nums;
        }
        .metric-card:hover .metric-number {
            transform: scale(1.05);
            color: #b80049;
        }
        .metric-bar {
            transition: width 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .metric-icon {
            width: 56px;
            height: 56px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .metric-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .metric-header span:last-child {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #5d5f5f;
        }
        
        /* 🔥 NOVA ANIMAÇÃO COM CSS + JS (MAIS CONFIÁVEL) */
        .counter-value {
            transition: all 0.3s ease;
        }
        .counter-value.animated {
            animation: pulse 0.5s ease-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>

<script>
    const SUPABASE_URL = 'https://nhnhqjyrawaftlomlilg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5obmhxanlyYXdhZnRsb21saWxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDY3ODgsImV4cCI6MjA5Njc4Mjc4OH0.GtOdh4sLzxrwPxOvnKJO5bf4x4hebpuC9RlR-06V0RE';
    
    // 📱 ÍCONES DAS REDES SOCIAIS
    const ICONE_YOUTUBE = 'https://nhnhqjyrawaftlomlilg.supabase.co/storage/v1/object/public/iconesredessociais/youtube_10124072.png';
    const ICONE_INSTAGRAM = 'https://nhnhqjyrawaftlomlilg.supabase.co/storage/v1/object/public/iconesredessociais/instagram_4401407.png';
    const ICONE_TIKTOK = 'https://nhnhqjyrawaftlomlilg.supabase.co/storage/v1/object/public/iconesredessociais/tiktokoficial_5969008.png';
    const ICONE_FACEBOOK = 'https://nhnhqjyrawaftlomlilg.supabase.co/storage/v1/object/public/iconesredessociais/facebookl_10096274.png';
    const LINK_FACEBOOK = 'https://www.facebook.com/formosuradecostura';
    
    // 📊 ÍCONES DAS MÉTRICAS
    const ICONE_TIKTOK_IMPACTO = 'https://nhnhqjyrawaftlomlilg.supabase.co/storage/v1/object/public/iconesredessociais/tiktok%20impacto.png';
    const ICONE_REELS_INSTA = 'https://nhnhqjyrawaftlomlilg.supabase.co/storage/v1/object/public/iconesredessociais/rees%20insta.png';
    const ICONE_COMUNIDADE = 'https://nhnhqjyrawaftlomlilg.supabase.co/storage/v1/object/public/iconesredessociais/comunidade.png';
    
    // 🔧 CONTROLE DE CONCORRÊNCIA
    let isLoading = false;
    let currentAbortController = null;
    let cache = { data: null, timestamp: 0 };
    const CACHE_TTL = 30000;

    async function carregarDados() {
        if (isLoading) {
            console.warn('[DEBUG] carregarDados já em execução, ignorando nova chamada');
            return;
        }
        if (currentAbortController) {
            currentAbortController.abort();
            console.log('[DEBUG] Fetch anterior cancelado');
        }
        const now = Date.now();
        if (cache.data && (now - cache.timestamp) < CACHE_TTL) {
            console.log('[DEBUG] Usando dados em cache (TTL válido)');
            renderizarDados(cache.data.config, cache.data.portfolio);
            return;
        }
        isLoading = true;
        currentAbortController = new AbortController();
        const signal = currentAbortController.signal;
        try {
            console.log('[DEBUG] Iniciando fetch fresh (sem cache)');
            const [configResp, portResp] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/site_config?select=config_key,config_value`, { 
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    signal
                }),
                fetch(`${SUPABASE_URL}/rest/v1/portfolio?select=*&order=ordem`, { 
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    signal
                })
            ]);
            if (signal.aborted) {
                console.log('[DEBUG] Fetch cancelado, ignorando resposta');
                return;
            }
            const configArray = await configResp.json();
            const config = {};
            configArray.forEach(item => { config[item.config_key] = item.config_value; });
            let portfolio = await portResp.json();
            const uniquePortfolio = [];
            const seenIds = new Set();
            for (const item of portfolio) {
                if (!seenIds.has(item.id)) {
                    seenIds.add(item.id);
                    uniquePortfolio.push(item);
                } else {
                    console.warn(`[DEBUG] Duplicata removida: ID ${item.id}`);
                }
            }
            if (uniquePortfolio.length !== portfolio.length) {
                console.warn(`[DEBUG] Removidas ${portfolio.length - uniquePortfolio.length} duplicatas do portfolio`);
                portfolio = uniquePortfolio;
            }
            cache = { data: { config, portfolio }, timestamp: now };
            renderizarDados(config, portfolio);
        } catch (err) {
            if (err.name === 'AbortError') {
                console.log('[DEBUG] Fetch abortado pelo usuário');
            } else {
                console.error('[DEBUG] Erro no carregamento:', err);
                const main = document.getElementById('conteudo-principal');
                if (main) {
                    main.innerHTML = `<div class="text-red-500 text-center p-10">Erro: ${err.message}</div>`;
                }
            }
        } finally {
            setTimeout(() => {
                isLoading = false;
                currentAbortController = null;
                console.log('[DEBUG] Lock liberado');
            }, 100);
        }
    }
    
    // 🎯 NOVA FUNÇÃO DE ANIMAÇÃO - MAIS SIMPLES E CONFIÁVEL
    // Baseada em soluções de fóruns [citation:1][citation:3][citation:4]
    function animarContador(elemento, valorFinal, duracao = 2500) {
        if (!elemento) return;
        
        // Remove animações anteriores
        if (elemento._animacaoIntervalo) {
            clearInterval(elemento._animacaoIntervalo);
            delete elemento._animacaoIntervalo;
        }
        
        // Converte o valor final
        let numeroFinal = 0;
        let sufixo = '';
        const textoOriginal = String(valorFinal).trim();
        
        // Extrai número e sufixo (M, K, %)
        const match = textoOriginal.match(/^([\d.,]+)\s*([MK%]?)$/i);
        if (match) {
            const numeroStr = match[1].replace(/\./g, '').replace(',', '.');
            numeroFinal = parseFloat(numeroStr) || 0;
            sufixo = match[2] ? match[2].toUpperCase() : '';
        } else {
            numeroFinal = parseFloat(textoOriginal.replace(/[^\d.,]/g, '').replace(',', '.')) || 0;
        }
        
        // Se não for um número válido, exibe o texto original
        if (isNaN(numeroFinal) || numeroFinal <= 0) {
            elemento.innerText = textoOriginal;
            return;
        }
        
        console.log('[DEBUG] Animando:', elemento.id, 'de 0 até', numeroFinal, sufixo);
        
        // Se for muito pequeno, exibe direto
        if (numeroFinal < 10) {
            elemento.innerText = textoOriginal;
            return;
        }
        
        // Define o valor inicial como 0
        elemento.innerText = '0';
        
        // Calcula o passo
        const passos = Math.max(60, Math.floor(duracao / 16));
        const incremento = numeroFinal / passos;
        let valorAtual = 0;
        let passoAtual = 0;
        
        // Função para formatar o número
        function formatarNumero(valor) {
            if (valor >= 1000000) {
                return (valor / 1000000).toFixed(1).replace('.', ',') + 'M';
            } else if (valor >= 1000) {
                return (valor / 1000).toFixed(1).replace('.', ',') + 'K';
            } else {
                let resultado = valor.toLocaleString('pt-BR');
                if (sufixo && valor < 1000) {
                    resultado += sufixo;
                }
                return resultado;
            }
        }
        
        // Inicia o intervalo
        elemento._animacaoIntervalo = setInterval(() => {
            passoAtual++;
            valorAtual += incremento;
            
            if (passoAtual >= passos || valorAtual >= numeroFinal) {
                // Valor final
                elemento.innerText = formatarNumero(numeroFinal);
                clearInterval(elemento._animacaoIntervalo);
                delete elemento._animacaoIntervalo;
                console.log('[DEBUG] Animação concluída:', elemento.id);
                return;
            }
            
            // Valor intermediário
            const valorDisplay = Math.floor(valorAtual);
            elemento.innerText = formatarNumero(valorDisplay);
        }, 16);
    }
    
    // 🧩 FUNÇÃO DE RENDERIZAÇÃO

                <div class="lg:col-span-7 space-y-6">
                    <div><h1 class="text-5xl md:text-7xl font-extrabold text-[#b80049] leading-tight">${escapeHtml(config.nome_profissional)}</h1><h2 class="text-2xl md:text-3xl text-[#5d5f5f] italic mt-2">${escapeHtml(config.sub_nome)}</h2><div class="w-24 h-1 bg-gradient-to-r from-[#b80049] to-[#e4bdc2] my-5 rounded-full"></div><p class="text-xl md:text-2xl text-[#5b3f43] font-medium">${escapeHtml(config.bio_curta)}</p></div>
                    <div class="flex flex-wrap gap-3"><div class="px-5 py-2.5 bg-[#b80049]/10 rounded-full text-[#b80049] font-bold flex items-center gap-2"><span class="material-symbols-outlined">stars</span> ${escapeHtml(config.tag1)}</div><div class="px-5 py-2.5 bg-[#b80049]/10 rounded-full text-[#b80049] font-bold flex items-center gap-2"><span class="material-symbols-outlined">auto_graph</span> ${escapeHtml(config.tag2)}</div></div>
                    <div class="flex gap-4 mt-4">
                        <a href="${escapeHtml(config.youtube_url)}" target="_blank" class="w-12 h-12 rounded-full bg-[#b80049]/10 flex items-center justify-center hover:bg-[#b80049] transition group">
                            <img src="${ICONE_YOUTUBE}" alt="YouTube" class="w-6 h-6 group-hover:brightness-0 group-hover:invert">
                        </a>
                        <a href="${escapeHtml(config.instagram_url)}" target="_blank" class="w-12 h-12 rounded-full bg-[#b80049]/10 flex items-center justify-center hover:bg-[#b80049] transition group">
                            <img src="${ICONE_INSTAGRAM}" alt="Instagram" class="w-6 h-6 group-hover:brightness-0 group-hover:invert">
                        </a>
                        <a href="${escapeHtml(config.tiktok_url)}" target="_blank" class="w-12 h-12 rounded-full bg-[#b80049]/10 flex items-center justify-center hover:bg-[#b80049] transition group">
                            <img src="${ICONE_TIKTOK}" alt="TikTok" class="w-6 h-6 group-hover:brightness-0 group-hover:invert">
                        </a>
                        <a href="${LINK_FACEBOOK}" target="_blank" class="w-12 h-12 rounded-full bg-[#b80049]/10 flex items-center justify-center hover:bg-[#b80049] transition group">
                            <img src="${ICONE_FACEBOOK}" alt="Facebook" class="w-6 h-6 group-hover:brightness-0 group-hover:invert">
                        </a>
                    </div>
                </div>
            </div>
            
            <!-- 🎬 YOUTUBE PLAYER RESPONSIVO -->
            <div class="mb-16 animate-fade-up" style="animation-delay:0.1s">
                <h3 class="text-2xl md:text-3xl text-[#b80049] mb-5 font-serif flex items-center gap-2">
                    <span class="material-symbols-outlined">smart_display</span> 
                    Vídeo em destaque
                </h3>
                <div class="relative w-full aspect-video rounded-xl overflow-hidden shadow-2xl bg-black">
                    <iframe 
                        src="https://www.youtube.com/embed/lYiAiQhrGoU?autoplay=0&rel=0&modestbranding=1"
                        title="Porta Batom Chaveiro - Formosura de Costura"
                        frameBorder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowFullScreen
                        class="absolute top-0 left-0 w-full h-full"
                        loading="lazy"
                    ></iframe>
                </div>
            </div>
            
            <div id="metricas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-16">
                <div class="metric-card bg-white/80 p-6 rounded-2xl soft-shadow border border-white/50 hover-lift">
                    <div class="metric-header">
                        <img src="${ICONE_TIKTOK_IMPACTO}" alt="TikTok Impacto" class="metric-icon">
                        <span>TikTok Impacto</span>
                    </div>
                    <div class="mt-8">
                        <div class="text-4xl font-black text-[#b80049] metric-number" id="tiktok-counter">0</div>

                    <div class="metric-header">
                        <img src="${ICONE_REELS_INSTA}" alt="Alcance Reels" class="metric-icon">

                        <div class="h-full bg-gradient-to-r from-[#b80049] to-[#e4bdc2] rounded-full metric-bar" style="--final-width: ${config.reels_percent || 0}%; width:0%" data-width="${config.reels_percent || 0}"></div>
                    </div>
                </div>
                <div class="metric-card bg-white/80 p-6 rounded-2xl soft-shadow border border-white/50 hover-lift">
                    <div class="metric-header">
                        <img src="${ICONE_COMUNIDADE}" alt="Comunidade" class="metric-icon">

                    </div>
                    <div class="mt-8">

                <div class="bg-gradient-to-br from-[#b80049] to-[#9c003e] text-white p-6 rounded-2xl shadow-2xl hover-lift metric-card">
                    <div class="flex justify-between mb-4">
                        <span class="material-symbols-outlined text-3xl">podcasts</span>
                        <span class="px-2 py-1 bg-white/20 rounded-full text-[10px] font-bold uppercase">Destaque</span>
                    </div>
                    <div class="text-4xl font-black metric-number" id="live-counter">0</div>

                </div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-16 animate-fade-up" style="animation-delay:0.2s">
                <div class="bg-white/80 p-8 rounded-2xl soft-shadow border border-white/50"><h3 class="text-2xl md:text-3xl text-[#b80049] mb-6 flex items-center gap-3"><span class="material-symbols-outlined">pie_chart</span> Perfil da Audiência</h3><div class="grid grid-cols-2 gap-6"><div><div class="text-xs font-bold uppercase text-[#5d5f5f]">Gênero</div><div class="flex items-end gap-2 mt-2"><span class="text-4xl font-black text-[#b80049]">${escapeHtml(config.genero_porcentagem)}</span><span class="material-symbols-outlined text-[#b80049] text-3xl">female</span></div><div class="text-sm mt-1">${escapeHtml(config.genero_texto)}</div></div><div><div class="text-xs font-bold uppercase text-[#5d5f5f]">Idade</div><div class="flex items-end gap-2 mt-2"><span class="text-4xl font-black text-[#b80049]">${escapeHtml(config.idade_range)}</span></div><div class="text-sm mt-1">${escapeHtml(config.idade_texto)}</div></div></div><div class="mt-10 p-6 bg-[#fef5f2] rounded-xl border-l-4 border-[#b80049] italic"><p class="text-lg">“${escapeHtml(config.citacao)}”</p></div></div>
                <div class="stitching-border bg-white/80 p-8 rounded-2xl flex flex-col justify-center items-center text-center space-y-6 hover-lift"><div class="w-20 h-20 rounded-full bg-[#b80049]/10 flex items-center justify-center"><span class="material-symbols-outlined text-[#b80049] text-4xl">shopping_cart_checkout</span></div><h3 class="text-3xl md:text-4xl font-bold leading-tight">${escapeHtml(config.texto_proposta)}</h3><p class="text-[#5d5f5f] max-w-md">${escapeHtml(config.subtitulo_proposta)}</p><a href="https://wa.me/5531998705172?text=Ol%C3%A1%21%20Gostaria%20de%20receber%20o%20M%C3%ADdia%20Kit%20atualizado%20para%20conhecer%20os%20formatos%20de%20parceria" target="_blank" rel="noopener noreferrer" class="stitching-border border-[#b80049] text-[#b80049] px-8 py-3 rounded-full font-bold hover:bg-[#b80049] hover:text-white transition">Solicitar proposta</a></div>
            </div>
            <div id="portfolio" class="mb-12 animate-fade-up" style="animation-delay:0.3s"><h3 class="text-2xl md:text-3xl text-[#b80049] mb-6 font-serif">Portfólio Criativo</h3><div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4" id="portfolio-grid"></div></div>
        `;
        
        // 🖼️ RENDERIZAR PORTFOLIO
        const grid = document.getElementById('portfolio-grid');
        if (grid && portfolio && portfolio.length) {
            grid.innerHTML = '';
            const uniqueItems = new Map();
            portfolio.forEach(item => {
                if (!uniqueItems.has(item.id)) {
                    uniqueItems.set(item.id, item);
                }
            });
            uniqueItems.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'group relative aspect-square bg-[#efeded] rounded-xl overflow-hidden shadow-md hover:shadow-xl transition';
                card.innerHTML = `<img class="w-full h-full object-cover group-hover:scale-110 transition duration-500" src="${escapeHtml(item.imagem_url)}" alt="${escapeHtml(item.legenda)}" loading="lazy"><div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition flex items-end justify-center p-3"><span class="text-white text-xs font-bold uppercase tracking-wider">${escapeHtml(item.legenda)}</span></div>`;
                grid.appendChild(card);
            });
        } else if (grid) {
            grid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">Nenhum item no portfólio ainda.</div>';
        }
        
        // 📊 ANIMAÇÃO DAS BARRAS
        document.querySelectorAll('[data-width]').forEach(bar => { 
            const width = bar.getAttribute('data-width') || 0;
            setTimeout(() => {
                bar.style.width = width + '%';
            }, 300);
        });
        
        // 📞 FOOTER
        document.getElementById('footer-nome').innerText = config.nome_profissional || '';
        document.getElementById('footer-bio').innerText = config.sub_nome || '';
        document.getElementById('footer-email').innerText = config.email_contato || '';
        document.getElementById('footer-phone').innerText = config.telefone_contato || '';
        
        // 📱 ÍCONES NO FOOTER
        document.getElementById('social-icons-footer').innerHTML = `
            <a href="${escapeHtml(config.youtube_url)}" target="_blank" class="w-10 h-10 rounded-full bg-[#b80049]/10 flex items-center justify-center hover:bg-[#b80049] transition group">
                <img src="${ICONE_YOUTUBE}" alt="YouTube" class="w-5 h-5 group-hover:brightness-0 group-hover:invert">
            </a>
            <a href="${escapeHtml(config.instagram_url)}" target="_blank" class="w-10 h-10 rounded-full bg-[#b80049]/10 flex items-center justify-center hover:bg-[#b80049] transition group">
                <img src="${ICONE_INSTAGRAM}" alt="Instagram" class="w-5 h-5 group-hover:brightness-0 group-hover:invert">
            </a>
            <a href="${escapeHtml(config.tiktok_url)}" target="_blank" class="w-10 h-10 rounded-full bg-[#b80049]/10 flex items-center justify-center hover:bg-[#b80049] transition group">
                <img src="${ICONE_TIKTOK}" alt="TikTok" class="w-5 h-5 group-hover:brightness-0 group-hover:invert">
            </a>
            <a href="${LINK_FACEBOOK}" target="_blank" class="w-10 h-10 rounded-full bg-[#b80049]/10 flex items-center justify-center hover:bg-[#b80049] transition group">
                <img src="${ICONE_FACEBOOK}" alt="Facebook" class="w-5 h-5 group-hover:brightness-0 group-hover:invert">
            </a>
        `;
        
        // 🔥 INICIAR ANIMAÇÕES USANDO INTERSECTION OBSERVER (NOVA ABORDAGEM)
        // Baseado em soluções de fóruns [citation:1][citation:5]
        console.log('[DEBUG] Configurando Intersection Observer para animações...');
        
        // Função que inicia as animações
        function iniciarAnimacoes() {
            console.log('[DEBUG] Iniciando animações dos números...');
            
            const elementos = {
                tiktok: document.getElementById('tiktok-counter'),
                reels: document.getElementById('reels-counter'),
                comunidade: document.getElementById('comunidade-counter'),
                live: document.getElementById('live-counter')
            };
            
            console.log('[DEBUG] Elementos encontrados:', {
                tiktok: !!elementos.tiktok,
                reels: !!elementos.reels,
                comunidade: !!elementos.comunidade,
                live: !!elementos.live
            });
            
            // Valores corrigidos: 3.3M e 3.6M
            if (elementos.tiktok) {
                console.log('[DEBUG] Animando TikTok para 3.3M');
                animarContador(elementos.tiktok, '3.3M', 2500);
            }
            if (elementos.reels) {
                console.log('[DEBUG] Animando Reels para 3.6M');
                animarContador(elementos.reels, '3.6M', 2500);
            }
            if (elementos.comunidade) {
                const valorComunidade = config.comunidade_num || '0';
                console.log('[DEBUG] Animando Comunidade para', valorComunidade);
                animarContador(elementos.comunidade, valorComunidade, 2500);
            }
            if (elementos.live) {
                const valorLive = config.live_views || '0';
                console.log('[DEBUG] Animando Live para', valorLive);
                animarContador(elementos.live, valorLive, 2500);
            }
        }
        
        // Usa Intersection Observer para iniciar a animação quando a seção ficar visível
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    console.log('[DEBUG] Seção de métricas visível, iniciando animações...');
                    iniciarAnimacoes();
                    observer.disconnect(); // Para de observar depois de iniciar
                }
            });
        }, { threshold: 0.3 }); // Inicia quando 30% da seção estiver visível
        
        // Observa a seção de métricas
        const metricasSection = document.getElementById('metricas');
        if (metricasSection) {
            observer.observe(metricasSection);
            console.log('[DEBUG] Observando seção de métricas...');
        } else {
            // Fallback: se não encontrar a seção, inicia após 1 segundo
            console.warn('[DEBUG] Seção de métricas não encontrada, iniciando com delay...');
            setTimeout(iniciarAnimacoes, 1000);
        }
        
        // Fallback: Se a animação não iniciar em 3 segundos, força início
        setTimeout(() => {
            // Verifica se os números ainda estão em 0
            const tiktokEl = document.getElementById('tiktok-counter');
            if (tiktokEl && tiktokEl.innerText === '0') {
                console.warn('[DEBUG] Fallback: forçando início das animações...');
                iniciarAnimacoes();
            }
        }, 3000);
    }
    
    function escapeHtml(str) { 
        if(!str) return ''; 
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); 
    }
    
    // 🚀 INICIAR
    let debounceTimer;
    function iniciarComDebounce() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            carregarDados();
        }, 300);
    }
    iniciarComDebounce();
</script>
</body>
