<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Painel de Controle | Rose</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif;background:#fbf9f8}.material-symbols-outlined{font-variation-settings:'FILL'0,'wght'400,'GRAD'0,'opsz'24}.soft-shadow{box-shadow:0 4px 20px rgba(184,0,73,0.05)}.stitching-border{border:2px dashed #e4bdc2}</style>
</head>
<body>
<div id="login-container" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#fbf9f8] to-[#fef5f2]">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
        <div class="w-20 h-20 mx-auto bg-[#b80049]/10 rounded-full flex items-center justify-center mb-4"><span class="material-symbols-outlined text-[#b80049] text-4xl">lock</span></div>
        <h2 class="text-2xl font-bold text-[#b80049] mb-2">Área Restrita</h2><p class="text-[#5d5f5f] mb-6">Digite a senha para acessar o painel</p>
        <input type="password" id="senha-input" class="w-full border border-[#e4bdc2] rounded-lg px-4 py-2 focus:outline-none focus:border-[#b80049] mb-4" placeholder="Senha">
        <button onclick="verificarSenha()" class="w-full bg-[#b80049] text-white py-2 rounded-lg font-bold hover:bg-[#9c003e] transition">Entrar</button>
        <p id="erro-senha" class="text-red-500 text-sm mt-3 hidden">Senha incorreta.</p>
    </div>
</div>
<div id="painel-container" style="display:none;">
    <div class="max-w-[1280px] mx-auto px-4 md:px-6 py-8">
        <header class="mb-10 flex justify-between items-center border-b border-dashed border-[#e4bdc2] pb-5">
            <div><h1 class="text-4xl font-bold text-[#b80049] font-serif">Painel de Controle</h1><p class="text-[#5d5f5f]">Gerencie seu Kit de Mídia</p></div>
            <div class="flex gap-3"><a href="index.html" target="_blank" class="px-5 py-2 border border-[#b80049] text-[#b80049] rounded-lg hover:bg-[#b80049]/10 flex items-center gap-2"><span class="material-symbols-outlined">visibility</span> Ver site</a><button onclick="logout()" class="px-5 py-2 border border-red-500 text-red-500 rounded-lg hover:bg-red-50 flex items-center gap-2"><span class="material-symbols-outlined">logout</span> Sair</button></div>
        </header>
        <div id="formulario-painel" class="space-y-8"><div class="text-center py-10 text-[#5d5f5f]">Carregando dados...</div></div>
        <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-dashed border-[#e4bdc2] p-5 z-50">
            <div class="max-w-[1280px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-2 text-[#5d5f5f] text-sm" id="status-msg"><span class="material-symbols-outlined text-[#b80049] text-base">info</span> Pronto para salvar</div>
                <div class="flex gap-4"><button onclick="descartarAlteracoes()" class="px-8 py-2 border border-dashed border-[#5d5f5f] text-[#5d5f5f] rounded-lg hover:bg-[#efeded]">Descartar</button><button onclick="salvarTudo()" class="px-10 py-2 bg-[#b80049] text-white rounded-lg shadow-md hover:opacity-90 flex items-center gap-2"><span class="material-symbols-outlined">publish</span> Salvar</button></div>
            </div>
        </div>
    </div>
</div>
<script>
    const SUPABASE_URL = 'https://nhnhqjyrawaftlomlilg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5obmhxanlyYXdhZnRsb21saWxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDY3ODgsImV4cCI6MjA5Njc4Mjc4OH0.GtOdh4sLzxrwPxOvnKJO5bf4x4hebpuC9RlR-06V0RE';
    const SENHA_CORRETA = 'Rose2025';
    let salvando = false;
    let portfolioOriginalIds = new Set(); // 🔧 Controle de IDs originais para evitar duplicação

    function verificarSenha() { const senha = document.getElementById('senha-input').value; if(senha === SENHA_CORRETA){ document.getElementById('login-container').style.display='none'; document.getElementById('painel-container').style.display='block'; carregarDados(); } else { const e=document.getElementById('erro-senha'); e.classList.remove('hidden'); setTimeout(()=>e.classList.add('hidden'),3000); } }
    function logout() { document.getElementById('login-container').style.display='flex'; document.getElementById('painel-container').style.display='none'; document.getElementById('senha-input').value=''; }

    async function carregarDados() {
        const container = document.getElementById('formulario-painel');
        container.innerHTML = '<div class="text-center py-10">Carregando...</div>';
        try {
            const [configResp, portResp] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/site_config?select=config_key,config_value`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }),
                fetch(`${SUPABASE_URL}/rest/v1/portfolio?select=*&order=ordem`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } })
            ]);
            const configArray = await configResp.json(); const config = {}; configArray.forEach(i=>config[i.config_key]=i.config_value);
            const portfolio = await portResp.json();
            
            // 🔧 Armazenar IDs originais para controle
            portfolioOriginalIds.clear();
            portfolio.forEach(item => portfolioOriginalIds.add(item.id));
            
            renderizarFormulario(config, portfolio);
        } catch(e){ container.innerHTML=`<div class="bg-red-100 p-6 rounded-xl">Erro: ${e.message}</div>`; }
    }

    function renderizarFormulario(config, portfolio) {
        const html = `
            <section class="bg-white p-6 rounded-xl soft-shadow border"><h2 class="text-2xl text-[#b80049] mb-5 flex gap-2"><span class="material-symbols-outlined">edit_note</span> Dados principais</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label class="block text-xs font-bold uppercase">Nome profissional</label><input type="text" id="nome_profissional" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.nome_profissional)}"></div>
                <div><label class="block text-xs font-bold uppercase">Subnome</label><input type="text" id="sub_nome" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.sub_nome)}"></div>
                <div class="md:col-span-2"><label class="block text-xs font-bold uppercase">Bio curta</label><input type="text" id="bio_curta" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.bio_curta)}"></div>
                <div><label class="block text-xs font-bold uppercase">E-mail</label><input type="email" id="email_contato" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.email_contato)}"></div>
                <div><label class="block text-xs font-bold uppercase">Telefone</label><input type="text" id="telefone_contato" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.telefone_contato)}"></div>
                <div class="md:col-span-2"><label class="block text-xs font-bold uppercase">URL da foto de perfil</label><input type="text" id="foto_perfil_url" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.foto_perfil_url)}"></div>
            </div></section>
            <section class="bg-white p-6 rounded-xl soft-shadow border"><h2 class="text-2xl text-[#b80049] mb-5 flex gap-2"><span class="material-symbols-outlined">share</span> Redes sociais e vídeo</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label class="block text-xs font-bold uppercase">YouTube URL</label><input type="text" id="youtube_url" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.youtube_url)}"></div>
                <div><label class="block text-xs font-bold uppercase">Instagram URL</label><input type="text" id="instagram_url" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.instagram_url)}"></div>
                <div><label class="block text-xs font-bold uppercase">TikTok URL</label><input type="text" id="tiktok_url" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.tiktok_url)}"></div>
                <div><label class="block text-xs font-bold uppercase">ID do vídeo YouTube</label><input type="text" id="youtube_video_id" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.youtube_video_id)}"></div>
            </div></section>
            <section class="bg-white p-6 rounded-xl soft-shadow border"><h2 class="text-2xl text-[#b80049] mb-5 flex gap-2"><span class="material-symbols-outlined">local_offer</span> Tags</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label class="block text-xs font-bold uppercase">Tag 1 (esquerda)</label><input type="text" id="tag1" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.tag1)}"></div>
                <div><label class="block text-xs font-bold uppercase">Tag 2 (direita)</label><input type="text" id="tag2" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 bg-transparent py-2" value="${escapeHtml(config.tag2)}"></div>
            </div></section>
            <section class="bg-white p-6 rounded-xl soft-shadow border"><h2 class="text-2xl text-[#b80049] mb-5 flex gap-2"><span class="material-symbols-outlined">analytics</span> Métricas</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div><label class="block text-xs font-bold uppercase">TikTok views</label><input type="text" id="tiktok_views" value="${escapeHtml(config.tiktok_views)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"><label class="block text-xs mt-2">Descrição</label><input type="text" id="tiktok_desc" value="${escapeHtml(config.tiktok_desc)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"><label class="block text-xs mt-2">%</label><input type="number" id="tiktok_percent" value="${config.tiktok_percent}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"></div>
                <div><label class="block text-xs font-bold uppercase">Reels reach</label><input type="text" id="reels_reach" value="${escapeHtml(config.reels_reach)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"><label class="block text-xs mt-2">Descrição</label><input type="text" id="reels_desc" value="${escapeHtml(config.reels_desc)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"><label class="block text-xs mt-2">%</label><input type="number" id="reels_percent" value="${config.reels_percent}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"></div>
                <div><label class="block text-xs font-bold uppercase">Comunidade</label><input type="text" id="comunidade_num" value="${escapeHtml(config.comunidade_num)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"><label class="block text-xs mt-2">Descrição</label><input type="text" id="comunidade_desc" value="${escapeHtml(config.comunidade_desc)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"></div>
            </div><div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label class="block text-xs font-bold uppercase">Live views</label><input type="text" id="live_views" value="${escapeHtml(config.live_views)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"><label class="block text-xs mt-2">Descrição</label><input type="text" id="live_desc" value="${escapeHtml(config.live_desc)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"></div>
                <div><label class="block text-xs font-bold uppercase">Texto destaque</label><textarea id="live_texto_destaque" rows="2" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2">${escapeHtml(config.live_texto_destaque)}</textarea></div>
            </div></section>
            <section class="bg-white p-6 rounded-xl soft-shadow border"><h2 class="text-2xl text-[#b80049] mb-5 flex gap-2"><span class="material-symbols-outlined">pie_chart</span> Perfil da audiência</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label class="block text-xs font-bold uppercase">% Gênero</label><input type="text" id="genero_porcentagem" value="${escapeHtml(config.genero_porcentagem)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"><label class="block text-xs mt-2">Texto</label><input type="text" id="genero_texto" value="${escapeHtml(config.genero_texto)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"></div>
                <div><label class="block text-xs font-bold uppercase">Faixa etária</label><input type="text" id="idade_range" value="${escapeHtml(config.idade_range)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"><label class="block text-xs mt-2">Texto</label><input type="text" id="idade_texto" value="${escapeHtml(config.idade_texto)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"></div>
                <div class="md:col-span-2"><label class="block text-xs font-bold uppercase">Citação</label><textarea id="citacao" rows="2" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2">${escapeHtml(config.citacao)}</textarea></div>
            </div></section>
            <section class="bg-white p-6 rounded-xl soft-shadow border"><h2 class="text-2xl text-[#b80049] mb-5 flex gap-2"><span class="material-symbols-outlined">shopping_cart_checkout</span> Proposta comercial</h2><div><label class="block text-xs font-bold uppercase">Título</label><input type="text" id="texto_proposta" value="${escapeHtml(config.texto_proposta)}" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2"></div><div class="mt-4"><label class="block text-xs font-bold uppercase">Subtítulo</label><textarea id="subtitulo_proposta" rows="2" class="w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 py-2">${escapeHtml(config.subtitulo_proposta)}</textarea></div></section>
            <section class="bg-white p-6 rounded-xl soft-shadow border"><div class="flex justify-between items-center mb-5"><h2 class="text-2xl text-[#b80049] flex gap-2"><span class="material-symbols-outlined">collections_bookmark</span> Portfólio</h2><button onclick="adicionarProjeto()" class="bg-[#b80049]/10 text-[#b80049] px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1"><span class="material-symbols-outlined text-base">add</span> Adicionar</button></div><div id="portfolio-editor" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div><div class="mt-4 text-xs text-center text-[#5d5f5f] border-t pt-3">💡 O sistema atualiza individualmente sem apagar tudo. Items removidos são deletados, novos são criados.</div></section>
        `;
        document.getElementById('formulario-painel').innerHTML = html;
        const container = document.getElementById('portfolio-editor');
        container.innerHTML = '';
        portfolio.forEach(item => {
            const card = document.createElement('div'); card.className = 'border border-dashed border-[#e4bdc2] rounded-lg p-3 bg-[#fef8f6]';
            card.setAttribute('data-portfolio-id', item.id);
            card.innerHTML = `<div class="aspect-square rounded-md overflow-hidden mb-2"><img src="${escapeHtml(item.imagem_url)}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x400'"></div><label class="block text-xs font-bold uppercase mt-2">URL da imagem</label><input type="text" data-id="${item.id}" data-campo="imagem_url" class="portfolio-input w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 text-sm" value="${escapeHtml(item.imagem_url)}"><label class="block text-xs font-bold uppercase mt-2">Legenda</label><input type="text" data-id="${item.id}" data-campo="legenda" class="portfolio-input w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 text-sm" value="${escapeHtml(item.legenda)}"><div class="flex justify-between mt-3"><span class="text-xs">Ordem: ${item.ordem}</span><button onclick="removerProjeto(${item.id})" class="text-red-500 text-xs hover:underline">Remover</button></div>`;
            container.appendChild(card);
        });
    }

    window.adicionarProjeto = function() {
        const novoId = Date.now();
        const container = document.getElementById('portfolio-editor');
        const card = document.createElement('div'); card.className = 'border border-dashed border-[#e4bdc2] rounded-lg p-3 bg-[#fef8f6]';
        card.setAttribute('data-portfolio-id', `new-${novoId}`);
        card.innerHTML = `<div class="aspect-square rounded-md overflow-hidden mb-2 bg-gray-200 flex items-center justify-center">Nova imagem</div><label class="block text-xs font-bold uppercase mt-2">URL da imagem</label><input type="text" data-id="${novoId}" data-campo="imagem_url" class="portfolio-input w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 text-sm" value="https://placehold.co/600x600"><label class="block text-xs font-bold uppercase mt-2">Legenda</label><input type="text" data-id="${novoId}" data-campo="legenda" class="portfolio-input w-full border-0 border-b border-[#e4bdc2] focus:border-[#b80049] focus:ring-0 text-sm" value="Novo projeto"><div class="flex justify-between mt-3"><span class="text-xs">Novo</span><button onclick="removerProjeto(${novoId})" class="text-red-500 text-xs hover:underline">Remover</button></div>`;
        container.appendChild(card);
    };
    
    window.removerProjeto = function(id) { 
        const cards = document.querySelectorAll('#portfolio-editor .border');
        for(let card of cards) {
            const input = card.querySelector(`input[data-id="${id}"]`);
            if(input) {
                card.remove();
                break;
            }
        }
    };

    async function salvarTudo() {
        if(salvando) return;
        salvando = true;
        const statusDiv = document.getElementById('status-msg');
        statusDiv.innerHTML = '<span class="material-symbols-outlined text-[#b80049] animate-spin">refresh</span> Salvando...';
        
        try {
            // 1. SALVAR CONFIGURAÇÕES (inalterado)
            const updates = {};
            const idsConfig = ['nome_profissional','sub_nome','bio_curta','email_contato','telefone_contato','foto_perfil_url','youtube_url','instagram_url','tiktok_url','youtube_video_id','tag1','tag2','tiktok_views','tiktok_desc','tiktok_percent','reels_reach','reels_desc','reels_percent','comunidade_num','comunidade_desc','live_views','live_desc','live_texto_destaque','genero_porcentagem','genero_texto','idade_range','idade_texto','citacao','texto_proposta','subtitulo_proposta'];
            for(let id of idsConfig) {
                const el = document.getElementById(id);
                if(el) updates[id] = el.value;
            }
            for(let [chave, valor] of Object.entries(updates)) {
                await fetch(`${SUPABASE_URL}/rest/v1/site_config?config_key=eq.${chave}`, { 
                    method:'PATCH', 
                    headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type':'application/json' }, 
                    body: JSON.stringify({ config_value: valor }) 
                });
            }
            
            // 2. 🔧 SALVAR PORTFOLIO SEM APAGAR TUDO (CORREÇÃO DO BUG)
            const cards = document.querySelectorAll('#portfolio-editor .border');
            const itemsToKeep = [];
            const itemsToDelete = [];
            const itemsToAdd = [];
            
            for(let card of cards) {
                const imgInput = card.querySelector('input[data-campo="imagem_url"]');
                const legInput = card.querySelector('input[data-campo="legenda"]');
                const idAttr = imgInput ? imgInput.getAttribute('data-id') : null;
                
                if(!imgInput || !legInput) continue;
                
                const imagem_url = imgInput.value.trim();
                if(!imagem_url) continue;
                
                const portfolioItem = {
                    imagem_url: imagem_url,
                    legenda: legInput.value,
                    ordem: itemsToKeep.length
                };
                
                // Verificar se é um ID existente (número) ou novo (timestamp)
                if(idAttr && !isNaN(parseInt(idAttr)) && portfolioOriginalIds.has(parseInt(idAttr))) {
                    portfolioItem.id = parseInt(idAttr);
                    itemsToKeep.push(portfolioItem);
                } else {
                    itemsToAdd.push(portfolioItem);
                }
            }
            
            // Coletar IDs para deletar (IDs que estavam no original mas não estão mais nos cards)
            const currentIds = new Set();
            for(let card of cards) {
                const imgInput = card.querySelector('input[data-campo="imagem_url"]');
                const idAttr = imgInput ? imgInput.getAttribute('data-id') : null;
                if(idAttr && !isNaN(parseInt(idAttr))) {
                    currentIds.add(parseInt(idAttr));
                }
            }
            
            for(let originalId of portfolioOriginalIds) {
                if(!currentIds.has(originalId)) {
                    itemsToDelete.push(originalId);
                }
            }
            
            // Executar DELETE apenas dos itens removidos
            for(let id of itemsToDelete) {
                await fetch(`${SUPABASE_URL}/rest/v1/portfolio?id=eq.${id}`, { 
                    method:'DELETE', 
                    headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${SUPABASE_ANON_KEY}` } 
                });
            }
            
            // Atualizar itens existentes (UPDATE)
            for(let item of itemsToKeep) {
                await fetch(`${SUPABASE_URL}/rest/v1/portfolio?id=eq.${item.id}`, { 
                    method:'PATCH', 
                    headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type':'application/json' }, 
                    body: JSON.stringify({ imagem_url: item.imagem_url, legenda: item.legenda, ordem: item.ordem }) 
                });
            }
            
            // Inserir novos itens (INSERT)
            for(let item of itemsToAdd) {
                await fetch(`${SUPABASE_URL}/rest/v1/portfolio`, { 
                    method:'POST', 
                    headers:{ 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type':'application/json' }, 
                    body: JSON.stringify({ imagem_url: item.imagem_url, legenda: item.legenda, ordem: item.ordem }) 
                });
            }
            
            statusDiv.innerHTML = '<span class="material-symbols-outlined text-green-600">check_circle</span> Salvo!';
            setTimeout(()=>{ statusDiv.innerHTML='<span class="material-symbols-outlined text-[#b80049]">info</span> Pronto para salvar'; },3000);
            
            // Recarregar dados para atualizar IDs
            await carregarDados();
            
        } catch(e) {
            console.error(e);
            statusDiv.innerHTML = '<span class="material-symbols-outlined text-red-500">error</span> Erro: ' + (e.message || 'desconhecido');
            setTimeout(()=>{ statusDiv.innerHTML='<span class="material-symbols-outlined text-[#b80049]">info</span> Pronto'; },4000);
        } finally {
            salvando = false;
        }
    }
    
    window.descartarAlteracoes = function(){ if(confirm('Descartar alterações não salvas?')) carregarDados(); };
    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
</script>
</body>
</html>
